name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
      - name: Instalar Buildozer
        run: pip install --upgrade pip cython==0.29.36 buildozer
      - name: Compilar APK
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log
      - name: Mostrar el error
        if: failure()
        run: |
          echo "===== LINEAS CON ERROR ====="
          grep -n -i -E "error|failed|exception|not found|no such" build.log | tail -n 40
          echo "===== ULTIMAS 60 LINEAS ====="
          tail -n 60 build.log
           - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MosaicStudio-APK
          path: bin/*.apk
